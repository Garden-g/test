  short_description: "从公开账号、视频与公司网页证据筛选销售或合作线索并生成表格"
  default_prompt: "使用 $b2b-tiktok-development-xlsx 按产品、国家和客户类型搜索 TikTok 潜在客户并生成可追溯的开发表格。"

dependencies:
