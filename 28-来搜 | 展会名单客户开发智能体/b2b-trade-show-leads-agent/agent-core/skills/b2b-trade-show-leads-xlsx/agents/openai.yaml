  short_description: "从展会参展商和官方目录搜索客户并生成可核验表格名单"
  default_prompt: "使用 $b2b-trade-show-leads-xlsx 按产品、客户类型和国家搜索展会参展商名单并生成客户开发 XLSX。"

dependencies:
  tools:
    - type: "mcp"
      value: "accio"
      description: "Accio tools web_search and ask_user for B2B customer discovery"

policy:
  allow_implicit_invocation: true
