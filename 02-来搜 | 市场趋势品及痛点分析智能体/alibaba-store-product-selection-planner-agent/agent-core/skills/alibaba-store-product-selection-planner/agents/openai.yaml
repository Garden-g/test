interface:
  display_name: "店铺选品定位"
  short_description: "结合店铺经营、行业机会和供应边界交互确定产品赛道与矩阵"
  default_prompt: "使用 $alibaba-store-product-selection-planner 先询问经营与供应约束，再读取店铺和行业数据，给出候选赛道让我确认并生成选品定位表格。"

dependencies:
  tools:
    - type: "mcp"
      value: "accio"
      description: "Accio ask_user, store data tools, accio-mcp-cli and Workctl read-only capabilities"

policy:
  allow_implicit_invocation: true
