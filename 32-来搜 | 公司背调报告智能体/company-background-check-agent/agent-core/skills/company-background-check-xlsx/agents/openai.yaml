  short_description: "按国家和公司名确认官网并生成可核验的公司背调表格"
  default_prompt: "使用 $company-background-check-xlsx 根据用户提供的国家和公司名确认官网 domain，运行 Apify Actor，并生成公司背调 XLSX。"

dependencies:
