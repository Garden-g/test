interface:
  display_name: "谷歌搜索找客户"
  short_description: "用谷歌搜索批量查海外客户官网候选线索并导出可核验结果"
  default_prompt: "Use $b2b-google-search to find overseas B2B company websites from Google Search and export CSV results."

dependencies:
  tools:
    - type: "mcp"
      value: "apify"
      description: "Apify MCP server accessed through mcpc session @apify"
      transport: "streamable_http"
      url: "https://mcp.apify.com"

policy:
  allow_implicit_invocation: true
