interface:
  display_name: "地图客户开发"
  short_description: "用地图和本地商家公开搜索寻找企业客户并生成表格名单"
  default_prompt: "使用 $b2b-maps-development-xlsx 按产品、客户类型和国家搜索地图/本地商家客户线索并生成 XLSX。"

dependencies:
  tools:
    - type: "mcp"
      value: "accio"
      description: "Accio tools web_search and ask_user for B2B customer discovery"

policy:
  allow_implicit_invocation: true
