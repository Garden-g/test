interface:
  display_name: "商品经营复盘"
  short_description: "只读汇总商品效果、质量分、内容、风险和广告线索并形成整改闭环"
  default_prompt: "使用 $alibaba-product-review-board 读取本期商品经营数据，完成商品分层、问题归因、整改清单和数据缺口表格。"

dependencies:
  tools:
    - type: "mcp"
      value: "accio"
      description: "Accio product read-only tools, accio-mcp-cli, Workctl and workbook delivery tools"

policy:
  allow_implicit_invocation: true
