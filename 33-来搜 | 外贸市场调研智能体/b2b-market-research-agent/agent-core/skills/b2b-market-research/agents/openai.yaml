  short_description: "用公开证据和企业材料研究国家、客户、渠道、竞争与市场进入条件"
  default_prompt: "使用 $b2b-market-research 围绕我的决策问题完成一份有来源、可复核的外贸市场调研报告。"

dependencies:
  tools:
