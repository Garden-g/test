interface:
  display_name: "企业平台客户搜索"
  short_description: "从海外企业平台和行业目录搜索客户并生成表格名单"
  default_prompt: "使用 $b2b-tob-platform-search-xlsx 按产品、客户类型和国家搜索 ToB 平台客户并生成 XLSX。"

dependencies:
  tools:
    - type: "mcp"
      value: "accio"
      description: "Accio tools web_search and ask_user for B2B customer discovery"

policy:
  allow_implicit_invocation: true
