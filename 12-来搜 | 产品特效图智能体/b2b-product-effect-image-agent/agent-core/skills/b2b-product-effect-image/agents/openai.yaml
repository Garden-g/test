  short_description: "在保持真实产品一致性的前提下制作功能可视化与高冲击宣传特效图"
  default_prompt: "使用 $b2b-product-effect-image 根据我的产品图和真实卖点，先给特效方向，再制作一张可用于外贸营销的产品特效图。"

dependencies:
  tools:
    - type: "mcp"
      value: "accio"
      description: "Accio ask_user, image inspection, image editing, web research and file delivery tools"

policy:
  allow_implicit_invocation: true
