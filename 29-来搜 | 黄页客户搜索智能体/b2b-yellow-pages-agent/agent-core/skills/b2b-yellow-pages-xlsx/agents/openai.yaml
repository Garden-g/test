interface:
  display_name: "黄页客户搜索"
  short_description: "从海外黄页和本地目录搜索企业客户并生成表格名单"
  default_prompt: "使用 $b2b-yellow-pages-xlsx 按产品、客户类型和国家搜索黄页/本地目录客户并生成 XLSX。"

dependencies:
  tools:
    - type: "mcp"
      value: "accio"
      description: "Accio tools web_search and ask_user for B2B customer discovery"

policy:
  allow_implicit_invocation: true
